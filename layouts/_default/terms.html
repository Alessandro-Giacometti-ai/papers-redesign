{{- define "main" }}
<section class="section-head wrap">
  <div class="section-title">
    <h1>{{ .Title }}</h1>
    <p class="section-count mono">{{ len .Data.Terms }} terms</p>
  </div>
  <div class="section-desc"><p class="lede">Every tag used across papers and projects, with the number of entries it groups.</p></div>
</section>
<section class="wrap terms">
  <ul class="plain term-list">
    {{- range .Data.Terms.Alphabetical }}
    <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}<span class="mono">{{ .Count }}</span></a></li>
    {{- end }}
  </ul>
</section>
{{- end }}
