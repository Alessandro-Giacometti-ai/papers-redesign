<header class="site-header">
  <div class="wrap header-grid">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">{{ site.Title }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      {{- $cur := . }}
      {{- range site.Menus.main }}
      {{- $active := eq $cur.Section (trim .URL "/") }}
      <a href="{{ .URL | relURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
    <div class="site-links">
      {{- range site.Params.links }}
      <a href="{{ .url }}" title="{{ .name }}" aria-label="{{ .name }}"{{ if not (hasPrefix .url "mailto:") }} target="_blank" rel="noopener"{{ end }}>{{ partial "icons.html" .icon }}</a>
      {{- end }}
    </div>
  </div>
</header>
